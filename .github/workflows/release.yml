# Push an annotated version tag (`git tag -a v0.2.5 -F notes.md && git push
# origin v0.2.5`) to build Workdesk and publish a GitHub Release. The tag's
# message becomes the release notes. The release carries a signed update and a
# latest.json manifest (with the same notes), which the in-app updater
# (src/updater.ts) checks.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # The checkout may hold the tag only as a lightweight ref; fetch the
      # annotated tag itself so its message can be read.
      - name: Read release notes from the tag
        id: notes
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$notes" ]; then
            echo "::error::$TAG has no message. Tag releases with: git tag -a $TAG -F notes.md"
            exit 1
          fi
          { echo "body<<__NOTES__"; echo "$notes"; echo "__NOTES__"; } >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Workdesk ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
