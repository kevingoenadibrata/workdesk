<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workdesk</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <aside id="sidebar">
      <div class="sidebar-top" data-tauri-drag-region></div>
      <div class="page-rows">
        <div id="home-slot"></div>
      </div>
      <label class="tab-search">
        <input id="tab-search" type="search" placeholder="Search tabs" spellcheck="false" autocomplete="off" aria-label="Search tabs" />
      </label>
      <nav id="tablist"></nav>
      <div class="sidebar-footer">
        <button id="open-shortcuts" class="icon-button" aria-label="Shortcuts"></button>
        <button id="open-settings" class="icon-button" aria-label="Settings"></button>
        <button id="collapse-sidebar" class="icon-button" aria-label="Collapse sidebar"></button>
      </div>
      <div id="sidebar-resizer"></div>
    </aside>
    <main id="main">
      <header id="titlebar" data-tauri-drag-region>
        <span id="title" data-tauri-drag-region></span>
      </header>
      <div id="terminals"></div>
    </main>
  </body>
</html>
