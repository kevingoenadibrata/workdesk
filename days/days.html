<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Days of the Year</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #777; --line: #e5e5e5; --hl: #fff6d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #eee; --muted: #888; --line: #2c2c2c; --hl: #3a3320; }
  }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  input[type=search] { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 16px;
         border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td:first-child { width: 90px; font-variant-numeric: tabular-nums; color: var(--muted); }
  tr.today td { background: var(--hl); }
  td.src, td.src a { color: var(--muted); font-size: 12px; }
  td.src a:hover { color: var(--fg); }
  #drop { display: none; padding: 24px; border: 1px dashed var(--line); border-radius: 6px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Days of the Year</h1>
  <p id="stats">Loading days.csv…</p>
  <input type="search" id="q" placeholder="Filter by date (10-17), name or source…">
  <div id="drop">Couldn't fetch <code>days.csv</code> (browsers block it over file://).<br>
    Pick it manually: <input type="file" id="file" accept=".csv"><br>
    or serve this folder: <code>python3 -m http.server -d data</code></div>
  <table>
    <thead><tr><th>Date</th><th>Day</th><th>Source</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const now = new Date();
  const today = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  let rows = [];

  // Minimal CSV: handles quoted fields with commas and "" escapes.
  function splitRow(line) {
    const cells = [];
    let cur = '', quoted = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (quoted) {
        if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') quoted = false;
        else cur += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { cells.push(cur); cur = ''; }
      else cur += c;
    }
    cells.push(cur);
    return cells.map(s => s.trim());
  }

  function parseCSV(text) {
    const out = [];
    for (const line of text.split(/\r?\n/).slice(1)) {
      if (!line.trim()) continue;
      const [date, name, source = ''] = splitRow(line);
      out.push({ date, name, sources: source.split(';').map(s => s.trim()).filter(Boolean) });
    }
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function sourceLinks(r) {
    return r.sources.map(s => {
      if (!/^https?:\/\//.test(s)) return esc(s);
      const host = new URL(s).hostname.replace(/^(www|en)\./, '');
      return `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(host)}</a>`;
    }).join(', ');
  }

  function label(d) {
    const [mm, dd] = d.split('-');
    return MONTHS[+mm - 1] ? `${MONTHS[+mm - 1]} ${+dd}` : d;
  }

  function render() {
    const q = document.getElementById('q').value.toLowerCase();
    const shown = rows.filter(r => !q || r.date.includes(q) || r.name.toLowerCase().includes(q)
      || label(r.date).toLowerCase().includes(q) || r.sources.some(s => s.toLowerCase().includes(q)));
    document.getElementById('rows').innerHTML = shown.map(r =>
      `<tr class="${r.date === today ? 'today' : ''}"><td>${label(r.date)}</td><td>${esc(r.name)}</td><td class="src">${sourceLinks(r)}</td></tr>`
    ).join('');
    const dates = new Set(rows.map(r => r.date)).size;
    document.getElementById('stats').textContent = `${rows.length} days across ${dates} / 366 dates · today is ${label(today)}`;
  }

  function load(text) { rows = parseCSV(text); render(); }

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('file').addEventListener('change', e => e.target.files[0]?.text().then(load));
  fetch('days.csv').then(r => r.ok ? r.text() : Promise.reject()).then(load).catch(() => {
    document.getElementById('drop').style.display = 'block';
    document.getElementById('stats').textContent = '';
  });
</script>
</body>
</html>
