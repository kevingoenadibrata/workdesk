<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Preview</title>
    <script type="module" src="/src/homePreview.ts"></script>
    <style>
      /* Dev-only page: the real Home page, fed mock tabs, agents and tickets. Not part of the build. */
      body {
        display: flex;
        flex-direction: column;
      }
      .preview-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--sunken);
        color: var(--muted);
        font: 12px var(--code);
      }
      .preview-bar strong {
        color: var(--text);
        font-weight: 500;
      }
      .preview-bar label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preview-bar select {
        padding: 3px 6px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      .preview-scenarios {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .preview-scenarios button {
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font: inherit;
      }
      .preview-scenarios button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--text);
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      #preview-host {
        position: relative;
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div class="preview-bar">
      <strong>Home preview</strong>
      <div class="preview-scenarios" id="preview-scenarios"></div>
      <label>Theme <select id="preview-theme"></select></label>
    </div>
    <div id="preview-host"></div>
  </body>
</html>
